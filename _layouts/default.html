<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }
    nav a { margin-right: 20px; text-decoration: none; color: #0366d6; }
    nav a.current { font-weight: bold; color: #000; }
    nav a:hover { text-decoration: underline; }
    footer { margin-top: 40px; font-size: 0.9em; color: #555; }
  </style>
</head>
<body>
  <!-- Header + Navigation Container -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0;">
    <!-- Left-aligned site title -->
    <h1 style="margin: 0;">{{ site.title }}</h1>

    <!-- Right-aligned navigation -->
    <nav style="display: flex; gap: 20px;">
    <a href="{{ "/" | relative_url }}" class="{% if page.url == '/' %}current{% endif %}">Home</a>
    <a href="{{ "/research.html" | relative_url }}">Research</a>
    <a href="{{ "/cv.html" | relative_url }}">CV</a>
  </nav>
  </div>

  <!-- Page content -->
  <main>
    {{ content }}
  </main>

  <footer>
    &copy; {{ site.time | date: "%Y" }} My GitHub Pages Site
  </footer>
</body>
</html>
